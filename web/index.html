<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DM Screen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Alegreya+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: a DM's working screen: fast, legible mid-fight, fantasy only in the lettering
   IDEA: the folding DM screen; the initiative order is the panel you stare at
   PICTURE: the turn order itself, large, the active turn lit; the map preview on its own tab
   COLOUR and TYPE: deep teal cloth header, slate ground, teal heroes, dragon-red foes, blue "now"; Cinzel + Alegreya Sans
   LAYOUT: tabs under the header; order wide left, add panel right; stacks under 900px */
:root{color-scheme:light dark;
--bg:light-dark(#eef0f3,#111419);--panel:light-dark(#ffffff,#1b1f26);--ink:light-dark(#151a21,#e8ecf2);--mut:light-dark(#5a6372,#98a2b3);
--line:light-dark(#d9dee6,#2b313b);--soft:light-dark(#f5f7fa,#151920);
--hero:light-dark(#0b7682,#41c4cf);--foe:light-dark(#b8322a,#ff6b5d);--now:light-dark(#2c5fd6,#7ea6ff);--ok:light-dark(#1f7a3a,#58c97a);
--cloth:#0b3a41;--cloth2:#0f4c55}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Alegreya Sans",system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:Cinzel,Georgia,serif;line-height:1.1;margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:8px;min-height:40px;padding:6px 12px;font-weight:700}
button:hover{border-color:var(--mut)}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,canvas:focus-visible{outline:3px solid var(--now);outline-offset:1px}
button.pri{background:var(--now);border-color:var(--now);color:#fff}button.danger{color:var(--foe)}button.arm{background:var(--foe);color:#fff;border-color:var(--foe)}
button.sm{min-height:32px;padding:3px 9px;font-size:14px}button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
input,select,textarea{background:var(--soft);border:1px solid var(--line);border-radius:7px;padding:7px 9px;font-size:16px;width:100%}
textarea{min-height:84px;resize:vertical;line-height:1.4}
label{display:block;font-size:14px;color:var(--mut);font-weight:500}
header{background:linear-gradient(180deg,var(--cloth2),var(--cloth));color:#eef7f6;padding:18px max(4vw,16px) 0}
header .top{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;justify-content:space-between}
header h1{font-size:clamp(26px,3.4vw,38px);letter-spacing:.02em}
#status{font-size:14px;color:#b9d7d6}
nav{display:flex;gap:4px;margin-top:14px;overflow-x:auto}
nav a{flex:0 0 auto;color:#cfe6e4;text-decoration:none;padding:10px 18px;border-radius:10px 10px 0 0;font-weight:700;font-size:17px;white-space:nowrap}
nav a.cur{background:var(--bg);color:var(--ink)}
main{padding:20px max(4vw,16px) 48px;max-width:1400px;margin:0 auto}
.two{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.round{font-family:Cinzel,serif;font-size:22px;margin-right:auto}.round b{font-size:32px;color:var(--now)}
.order{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.row{background:var(--panel);border:1px solid var(--line);border-left:6px solid var(--hero);border-radius:12px;padding:10px 12px;display:grid;grid-template-columns:72px minmax(0,1fr) minmax(0,250px) auto;gap:12px;align-items:center}
.row.foe{border-left-color:var(--foe)}.row.other{border-left-color:var(--mut)}
.row.now{outline:3px solid var(--now);box-shadow:0 6px 22px -10px var(--now)}
.row.out{opacity:.5}
.init{font-size:26px;font-weight:800;text-align:center;padding:6px 2px;height:56px}
.nm{font-size:19px;font-weight:800;line-height:1.2}.tag{font-size:12px;font-weight:700;padding:1px 7px;border-radius:99px;margin-left:6px;vertical-align:2px;color:#fff;background:var(--hero)}
.foe .tag{background:var(--foe)}.other .tag{background:var(--mut)}
.meta{font-size:14px;color:var(--mut)}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.shoprow{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-top:1px solid var(--line);align-items:baseline}.shoprow:first-of-type{border-top:0}.shoprow b{white-space:nowrap;text-align:right}.chip.on{background:var(--now);border-color:var(--now);color:#fff}
.chip{font-size:13px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);background:var(--soft);min-height:0;font-weight:600}
.hpline{display:flex;align-items:baseline;justify-content:space-between;font-size:14px}.hpline b{font-size:20px}
.hpbar{height:8px;border-radius:9px;background:var(--line);overflow:hidden;margin:3px 0 6px}.hpbar i{display:block;height:100%;background:var(--ok)}
.hpbar i.mid{background:#d79b16}.hpbar i.low{background:var(--foe)}
.dmg{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:4px}.dmg input{padding:5px 8px}
.tools{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;max-width:170px}
.tools select{width:auto;max-width:130px;font-size:14px;padding:5px}
.extra{grid-column:2/-1;border-top:1px dashed var(--line);padding-top:8px;display:grid;gap:8px}
.slots{display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:14px}
.slots .lv{font-weight:700;color:var(--mut);margin-right:3px}
.pip{width:22px;height:22px;min-height:0;padding:0;border-radius:50%;border:2px solid var(--hero);background:var(--hero);vertical-align:middle;margin-right:2px}
.pip.used{background:transparent}
.ds{display:flex;flex-wrap:wrap;gap:12px;align-items:center;background:light-dark(#fff1ef,#2a1715);border:1px solid var(--foe);border-radius:10px;padding:8px 10px}
.ds .pip{border-color:var(--ok);background:transparent}.ds .pip.f{border-color:var(--foe)}.ds .pip.lit{background:var(--ok)}.ds .pip.f.lit{background:var(--foe)}
.ds .res{font-weight:800}
.pre{white-space:pre-wrap;font-size:15px}
.add h3{font-size:19px;margin:4px 0 10px}.add section+section{margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.log{font-size:14px;color:var(--mut);margin:0;padding-left:18px}
.empty{padding:28px;text-align:center;color:var(--mut);border:2px dashed var(--line);border-radius:14px}
.hint{font-size:14px;color:var(--mut)}
.list{display:grid;gap:8px}
.pc{display:block;width:100%;text-align:left;border-left:6px solid var(--hero);padding:10px 12px;font-weight:400}
.pc.sel{outline:3px solid var(--now)}.pc.mon{border-left-color:var(--foe)}
.editor h2{font-size:26px;margin-bottom:12px}
.fs{border:0;padding:0;margin:0 0 18px}.fs legend{font-family:Cinzel,serif;font-weight:700;font-size:17px;margin-bottom:8px;padding:0}
.ab{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.ab div{text-align:center}.ab input{text-align:center;font-weight:800;font-size:18px}.ab .m{font-weight:800;font-size:15px}
.sl{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:6px}.sl input{text-align:center;padding:6px 2px}
.mapwrap{position:relative;height:clamp(340px,62vh,720px);background:#0c0f13;border-radius:14px;overflow:hidden}
.mapwrap canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.tray{display:flex;flex-wrap:wrap;gap:6px}
.tok{border-radius:99px;min-height:34px;font-size:14px;border-left:5px solid var(--hero)}.tok.foe{border-left-color:var(--foe)}.tok.placed{opacity:.55}
.code{font-family:ui-monospace,Menlo,monospace;font-size:14px;background:var(--soft);border:1px solid var(--line);padding:2px 6px;border-radius:6px}
body.table{background:#000;overflow:hidden}
#tbl{position:fixed;inset:0;width:100vw;height:100vh;background:#000;cursor:none}
.helper h3{font-size:20px;margin-bottom:6px}.helper p{margin:4px 0}.helper .warn{color:var(--foe);font-weight:800}
.card.helper{margin-bottom:12px;border-left:6px solid var(--now)}
.lvl{border:2px solid var(--now);margin-bottom:18px}.lvl h3{font-size:19px;margin-bottom:6px}.lvl ol{margin:6px 0;padding-left:22px}.lvl li{margin:4px 0}
#ov{position:fixed;left:50%;top:50%;pointer-events:none;z-index:1;font-size:clamp(15px,1.25vw,22px)}
#ov .ostrip{position:absolute;top:1.2vh;left:50%;transform:translateX(-50%);display:flex;gap:.4em;flex-wrap:wrap;justify-content:center;max-width:94%}
.os{background:rgba(11,118,130,.92);color:#fff;font-weight:800;padding:.25em .8em;border-radius:99px;border:2px solid transparent}.os.foe{background:rgba(184,50,42,.92)}
.os.cur{border-color:#ffd23f;box-shadow:0 0 0 3px #ffd23f;transform:scale(1.12)}
#ov .ocard{position:absolute;background:rgba(14,18,24,.88);color:#f1f4f8;border-radius:14px;padding:.8em 1em;max-width:min(34em,44%);line-height:1.35;--foe:#ff8a7d}
#ov .turn{left:1.5vw;bottom:2vh}#ov .rolls{right:1.5vw;top:8vh;max-height:84%;overflow:hidden;font-size:.85em}
#ov .lvcard{left:50%;top:50%;transform:translate(-50%,-50%);max-width:min(36em,70%);border:3px solid #ffd23f}#ov .lvcard ol{margin:.3em 0;padding-left:1.3em}
.bar.sub{min-height:0;margin-top:-6px}.bar.sub:empty{display:none}
.swatches{display:flex;gap:6px}.sw{width:32px;height:32px;min-height:0;padding:0;border-radius:50%;border:2px solid var(--line)}.sw.on{outline:3px solid var(--now);outline-offset:2px}
.atk{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--line)}.atk:last-child{border:0}.ab2{display:flex;gap:4px;flex-wrap:wrap}
.dice .last{min-height:120px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;background:var(--soft);border-radius:12px;padding:12px}
.bign{font-family:Cinzel,Georgia,serif;font-weight:700;font-size:clamp(52px,9vw,84px);line-height:1}.bign.g{color:var(--ok)}.bign.r{color:var(--foe)}.btext{font-size:clamp(22px,3vw,32px)}
.dgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}.die{min-height:58px;font-size:18px;font-family:Cinzel,serif}.die.d20{background:var(--now);color:#fff;border-color:var(--now)}
.rlog{list-style:none;margin:0;padding:0;display:grid;gap:6px}.rr{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.rrh{display:flex;justify-content:space-between;gap:8px;font-size:14px;color:var(--mut)}.rrb b{font-size:22px}.n20{color:var(--ok);font-weight:800}.n1{color:var(--foe);font-weight:800}
.trow{display:flex;gap:6px;align-items:center}.tname{flex:1;text-align:left;font-weight:600}.tname.sel{outline:3px solid var(--now)}
.hprev{display:block;max-width:100%;max-height:260px;border-radius:10px;margin-top:6px;border:1px solid var(--line)}
details summary{cursor:pointer;font-weight:600;min-height:32px;display:flex;align-items:center}
#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:12px;font-weight:700;font-size:17px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:5;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#ov .oroll{position:absolute;left:50%;bottom:3vh;transform:translateX(-50%);background:rgba(14,18,24,.92);color:#fff;border-radius:16px;padding:.5em 1.2em;display:flex;gap:.7em;align-items:center;font-weight:700;border:3px solid #41c4cf}
#ov .oroll b{font-size:2.4em;font-family:Cinzel,serif;line-height:1}#ov .oroll.g{border-color:#58c97a}#ov .oroll.r{border-color:#ff6b5d}
#ov .hand{left:50%;top:50%;transform:translate(-50%,-50%);width:min(30em,80%);max-width:80%;max-height:90%;overflow:hidden;text-align:center;border:3px solid #ffd23f;font-size:1.5em;padding:1em 1.2em}#ov .hand h3{font-size:1.5em;margin:.2em 0 .4em}
#ov .hand img{max-width:100%;max-height:62vh;border-radius:10px;display:block;margin:0 auto .5em}
@media(max-width:640px){.dgrid{grid-template-columns:repeat(4,minmax(0,1fr))}}
#tblwx{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none}
.mapwrap #dmwx{pointer-events:none}
.tools2{margin-bottom:6px}.grp{font-size:13px;font-weight:700;color:var(--mut);width:34px}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.snd{min-height:72px;font-size:17px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}.snd span{font-size:13px;font-weight:500;color:var(--mut)}
.snd.on{background:var(--hero);border-color:var(--hero);color:#fff}.snd.on span{color:#e6fbfb}.snd.fx:active{transform:scale(.97)}
.plist{list-style:none;padding:0;margin:10px 0;display:grid;gap:4px}
#sndbtn{background:var(--foe);color:#fff;border-color:var(--foe);vertical-align:middle}

.joinc button{color:var(--ink)}
.joinc{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;background:var(--cloth);color:#eef7f6;border:0}.joinc .hint{color:#b9d7d6}
.jurl{font-size:clamp(18px,2.4vw,26px);font-weight:800;word-break:break-all}.jcode{text-align:center}.jcode b{display:block;font-family:Cinzel,serif;font-size:clamp(44px,6vw,64px);letter-spacing:.12em;line-height:1.1}
.thread{max-height:46vh;overflow:auto;display:flex;flex-direction:column;gap:8px;padding:4px}
.bub{max-width:80%;background:var(--soft);border:1px solid var(--line);border-radius:12px 12px 12px 4px;padding:8px 12px;align-self:flex-start}.bub.me{align-self:flex-end;background:light-dark(#e6efff,#1d2a45);border-radius:12px 12px 4px 12px}
.hcard{border:2px solid #d9a21b;border-radius:10px;padding:8px;margin:4px 0;display:grid;gap:4px}.hcard img{max-width:100%;max-height:180px;border-radius:6px}
.prow{display:flex;gap:6px;align-items:center}.dot{width:10px;height:10px;border-radius:50%;background:var(--line);flex:none}.dot.on{background:var(--ok)}
#fsb{position:fixed;right:16px;bottom:16px;z-index:2;opacity:.85;transition:opacity .6s}#fsb.hide{opacity:0;pointer-events:none}
@media(max-width:900px){.two{grid-template-columns:minmax(0,1fr)}}
@media(max-width:640px){.row{grid-template-columns:60px minmax(0,1fr)}.row>.hpbox,.row>.tools{grid-column:1/-1;max-width:none;justify-content:flex-start}.extra{grid-column:1/-1}.ab{grid-template-columns:repeat(3,minmax(0,1fr))}.sl{grid-template-columns:repeat(5,minmax(0,1fr))}.init{font-size:22px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header id="hdr">
  <div class="top"><h1>DM Screen</h1><span><button id="sndbtn" class="sm" data-a="sndstop" hidden>Stop sound</button> <span id="status" role="status">Loading your game…</span></span></div>
  <nav id="tabs"><a href="#combat">Combat</a><a href="#party">Party</a><a href="#monsters">Monsters</a><a href="#map">Map</a><a href="#dice">Dice</a><a href="#handouts">Handouts</a><a href="#shop">Shop</a><a href="#sound">Sound</a><a href="#players" id="ptab" hidden>Players</a></nav>
</header>
<main id="view"></main>
<div id="toast" role="status" aria-live="polite"></div>
<script>
{
// ---------------- helpers
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=(v,d=0)=>{const n=parseFloat(v);return Number.isFinite(n)?n:d};
const mod=s=>Math.floor((num(s,10)-10)/2);
const sg=n=>(n>=0?'+':'')+n;
const uid=()=>Math.random().toString(36).slice(2,10);
const d20=()=>1+Math.floor(Math.random()*20);
const clone=o=>JSON.parse(JSON.stringify(o));
const use=n=>(window.claude&&typeof window.claude.use==='function')?window.claude.use(n).catch(()=>null):Promise.resolve(null);
function rollExpr(e){const m=String(e||'').replace(/\s/g,'').match(/^(\d*)d(\d+)([+-]\d+)?$/i);if(!m)return null;let t=0;for(let i=0;i<(+m[1]||1);i++)t+=1+Math.floor(Math.random()*+m[2]);return Math.max(1,t+(+m[3]||0))}
const ABIL=['str','dex','con','int','wis','cha'];
const CONDS=['Blinded','Charmed','Concentrating','Deafened','Exhaustion','Frightened','Grappled','Incapacitated','Invisible','Paralyzed','Petrified','Poisoned','Prone','Restrained','Stunned','Unconscious'];
const ORD=['1st','2nd','3rd','4th','5th','6th','7th','8th','9th'];
const FULL=[[],[2],[3],[4,2],[4,3],[4,3,2],[4,3,3],[4,3,3,1],[4,3,3,2],[4,3,3,3,1],[4,3,3,3,2],[4,3,3,3,2,1],[4,3,3,3,2,1],[4,3,3,3,2,1,1],[4,3,3,3,2,1,1],[4,3,3,3,2,1,1,1],[4,3,3,3,2,1,1,1],[4,3,3,3,2,1,1,1,1],[4,3,3,3,3,1,1,1,1],[4,3,3,3,3,2,1,1,1],[4,3,3,3,3,2,2,1,1]];
function classSlots(cls,lvl){const c=String(cls||'').toLowerCase();lvl=Math.max(1,Math.min(20,Math.round(num(lvl,1))));
  if(/bard|cleric|druid|sorcerer|wizard/.test(c))return FULL[lvl];
  if(/paladin|ranger|artificer/.test(c))return FULL[Math.ceil(lvl/2)];
  if(/warlock/.test(c)){const n=lvl<2?1:lvl<11?2:lvl<17?3:4,L=Math.min(5,Math.ceil(lvl/2)),a=Array(L).fill(0);a[L-1]=n;return a}
  return null}
const normSlots=s=>Array.from({length:9},(_,i)=>({max:num(s&&s[i]&&s[i].max),used:num(s&&s[i]&&s[i].used)}));
const prof=l=>2+Math.floor((Math.max(1,num(l,1))-1)/4);

// ---------------- state
// Online edition: this page was opened at /s/<CODE>/dm (DM) or /s/<CODE>/table (view-only projector link).
const OLM=location.pathname.match(/^\/s\/([A-Z]{2,8}-\d{2})\/(dm|table)\/?$/)||[];
const OL=OLM[1]||null,VIEWER=OLM[2]==='table';
const TABLE=location.hash==='#table'||VIEWER;
const BASE=OL?'/s/'+OL:'';
let DMKEY=null,TVKEY=null;
const defMap=()=>({img:null,name:'Map 1',sceneId:null,cols:24,rows:18,fogOn:true,fog:'',tokens:{},draw:[],auras:{},walls:{},weather:'none',autoDoor:true,showTokens:true,monBars:false,grid:false,table:{zoom:100,dx:0,dy:0,rot:0},rem:{order:true,turn:true,rolls:false,conds:true,dice:true},card:null,handout:null});
// ---------------- rules reminders (plain-language summaries)
const COND_TXT={Blinded:"Can't see. Attacks against it have advantage; its attacks have disadvantage.",Charmed:"Can't attack the one who charmed it.",Concentrating:"If hit, make a CON save (DC 10, or half the damage if higher) or the spell ends.",Deafened:"Can't hear.",Exhaustion:"Each level makes d20 rolls harder. Check the rules for the level.",Frightened:"Disadvantage on attacks and checks while the scary thing is in sight. Can't move closer to it.",Grappled:"Speed is 0.",Incapacitated:"No actions, bonus actions or reactions.",Invisible:"Attacks against it have disadvantage; its attacks have advantage.",Paralyzed:"Can't move or act. Attacks against it have advantage, and hits from 5 feet are critical hits.",Petrified:"Turned to stone. Can't move or act.",Poisoned:"Disadvantage on attack rolls and ability checks.",Prone:"On the ground. Its attacks have disadvantage. Close attacks against it have advantage, far ones disadvantage. Standing up costs half its speed.",Restrained:"Speed 0. Attacks against it have advantage; its attacks have disadvantage.",Stunned:"Can't move or act. Attacks against it have advantage.",Unconscious:"Drops what it holds and falls prone. Attacks against it have advantage, and hits from 5 feet are critical hits."};
const ROLLS=[['Attack with a weapon','Roll d20 + attack bonus. Tie or beat the target\'s AC to hit, then roll damage.'],['Spell attack','Roll d20 + spell attack bonus against the target\'s AC.'],['Spell with a saving throw','The target rolls d20 + their save. Below your spell save DC and the spell works.'],['Ability check','Climb, sneak, persuade: d20 + the skill bonus. Easy 10, medium 15, hard 20.'],['Saving throw','Dodge the trap or resist the spell: d20 + that ability\'s save bonus.'],['Advantage / disadvantage','Roll two d20s. Advantage keeps the higher, disadvantage the lower.'],['Natural 20 / natural 1','A 20 on an attack is a critical hit: roll the damage dice twice. A 1 always misses.'],['Initiative','d20 + DEX modifier. Highest goes first.'],['Death save','At 0 HP: d20. 10 or more is a success, 9 or less a failure. 1 counts twice; 20 gets you up with 1 HP.']];

// ---------------- saving (one write at a time per doc, coalesced)
const pend={},busy={},tm={};
function save(path,data){
  if(mode==='local'){saveLocal();return}
  if(!db||readOnly)return;
  pend[path]=data===null?null:clone(data);clearTimeout(tm[path]);tm[path]=setTimeout(()=>flush(path),300);setStatus('Saving…')}
async function write(path,data){return data===null?db.doc(path).delete():db.doc(path).set(data)}
async function flush(path){
  if(busy[path]||!(path in pend))return;

  try{await write(path,data)}catch(e){
    if(e&&e.code==='unavailable'){await new Promise(r=>setTimeout(r,400+Math.random()*700));try{await write(path,data)}catch{setStatus('Could not save. Check your connection.')}}
    else if(e&&e.code==='invalid_argument'){readOnly=true;setStatus('View only: changes on this screen are not saved.')}
    else if(e&&e.code==='quota_exceeded'){setStatus('Storage is full. Delete some old monsters or characters.')}
    else setStatus('Could not save: '+((e&&e.message)||e))}
  busy[path]=false;
  if(path in pend)flush(path);else if(!Object.keys(pend).length&&!Object.values(busy).some(Boolean)&&!readOnly)setStatus(savedMsg())}
const pending=p=>(p in pend)||busy[p];

// Imported files are not trusted: keep plain values only, cap sizes, and always make new ids (never overwrites anyone).
function cleanHero(raw){
  if(!raw||typeof raw!=='object'||Array.isArray(raw))return null;
  const o={};
  for(const [k,v] of Object.entries(raw)){
    if(!/^[A-Za-z][A-Za-z0-9_]{0,24}$/.test(k)||k==='constructor'||k==='prototype'||k==='img')continue;
    if(typeof v==='string')o[k]=v.slice(0,6000);
    else if(typeof v==='number'&&Number.isFinite(v))o[k]=v;
    else if(typeof v==='boolean')o[k]=v}
  o.name=String(o.name||'').trim().slice(0,60)||'Imported character';
  o.slots=normSlots(raw.slots);
  const d=raw.ds&&typeof raw.ds==='object'?raw.ds:{};o.ds={s:Math.max(0,Math.min(3,num(d.s))),f:Math.max(0,Math.min(3,num(d.f)))};
  return o}
async function importHeroes(file){
  try{
    if(file.size>2*1024*1024)throw new Error('That file is too big to be a character file.');
    const j=JSON.parse(await file.text(),(k,v)=>k==='__proto__'?undefined:v);
    const arr=Array.isArray(j)?j:Array.isArray(j&&j.heroes)?j.heroes:j&&typeof j==='object'&&j.name?[j]:null;
    if(!arr||!arr.length)throw new Error('This file has no characters in it.');
    if(j&&!Array.isArray(j)&&j.type&&j.type!=='characters')throw new Error('This file is not a DM Screen character file.');
    let n=0,skipped=0;
    for(const raw of arr.slice(0,50)){const h=cleanHero(raw);if(!h){skipped++;continue}const id=uid();S.heroes[id]=h;saveHero(id);n++}
    render();toast(n?`Imported ${n} character${n===1?'':'s'}${skipped||arr.length>50?' (some were skipped)':''}`:'Nothing could be imported from that file.')
  }catch(e){toast(e instanceof SyntaxError?"That file isn't a character file.":(e.message||String(e)))}}

function roll(expr){
  const src=String(expr||'').toLowerCase().replace(/\s+/g,'');if(!src)return null;
  const re=/([+-]?)(?:(\d*)d(\d+|%)(?:(kh|kl)(\d*))?|(\d+))/y;let pos=0,total=0,parts=[],nat=null,first=true;
  while(pos<src.length){re.lastIndex=pos;const m=re.exec(src);if(!m||!m[0])return null;pos=re.lastIndex;
    if(!first&&!m[1])return null;first=false;const sgn=m[1]==='-'?-1:1,lead=sgn<0?'- ':parts.length?'+ ':'';
    if(m[6]!==undefined){total+=sgn*+m[6];parts.push(lead+m[6]);continue}
    const n=Math.min(100,+m[2]||1),sides=m[3]==='%'?100:+m[3];if(!sides||sides>1000)return null;
    const rs=Array.from({length:n},()=>1+Math.floor(Math.random()*sides));let keep=rs.map((v,i)=>i);
    if(m[4]){const k=Math.max(1,Math.min(n,+m[5]||1));keep=rs.map((v,i)=>i).sort((a,b)=>m[4]==='kh'?rs[b]-rs[a]:rs[a]-rs[b]).slice(0,k)}
    total+=sgn*keep.reduce((a,i)=>a+rs[i],0);if(sides===20&&keep.length===1&&nat==null)nat=rs[keep[0]];
    parts.push(`${lead}${n}d${sides}${m[4]?m[4]+(m[5]||1):''} [${rs.map((v,i)=>keep.includes(i)?v:'('+v+')').join(', ')}]`)}
  return{total,detail:parts.join(' '),nat}}

function levelUp(h,how,manual){
  const from=Math.max(1,Math.round(num(h.level,1))),to=Math.min(20,from+1),cls=String(h.cls||'').toLowerCase(),die=HIT_DIE(cls),con=mod(h.con),steps=[];
  let gain=null;
  if(die){const avg=die/2+1;gain=how==='roll'?Math.max(1,1+Math.floor(Math.random()*die)+con):how==='manual'?Math.max(1,Math.round(num(manual))+con):Math.max(1,avg+con);
    steps.push(`Hit points: roll 1d${die} and add your CON modifier (${sg(con)}), or take the average ${avg}${sg(con)}. ${how==='manual'?'Rolled':how==='roll'?'Rolled for you':'Average'}: +${gain} max HP.`)}
  else steps.push('Hit points: roll your class Hit Die and add your CON modifier (minimum 1). Type the class on the sheet to have this worked out.');
  if(prof(to)>prof(from))steps.push(`Proficiency bonus goes up to ${sg(prof(to))}: add 1 to attacks, saves and skills you're proficient in.`);
  if(to===3)steps.push('Pick your subclass. It adds new features now and at later levels.');
  const asi=[4,8,12,16].includes(to)||(/fighter/.test(cls)&&[6,14].includes(to))||(/rogue/.test(cls)&&to===10);
  if(asi)steps.push('Ability Score Improvement: +2 to one score or +1 to two (max 20), or choose a feat.');
  if(to===19)steps.push('Epic Boon: choose a powerful feat.');
  if(to===5&&/barbarian|fighter|monk|paladin|ranger/.test(cls))steps.push('Extra Attack: attack twice when you take the Attack action.');
  if(/rogue/.test(cls)&&to%2===1)steps.push(`Sneak Attack grows to ${Math.ceil(to/2)}d6.`);
  const caster=/bard|cleric|druid|sorcerer|warlock|wizard/.test(cls);
  if(caster&&(to===4||to===10))steps.push('Learn one more cantrip.');
  if((caster||/artificer/.test(cls))&&[5,11,17].includes(to))steps.push('Damage cantrips get stronger: they roll an extra damage die.');
  const ot=classSlots(cls,from),nt=classSlots(cls,to);
  if(nt){const ch=nt.map((n,l)=>n>(ot&&ot[l]||0)?`${ORD[l]} level: ${ot&&ot[l]||0} → ${n}`:'').filter(Boolean);if(ch.length)steps.push(`New spell slots (${ch.join(', ')}). Filled in for you.`);
    if(nt.length>(ot?ot.length:0))steps.push(`You can now cast ${ORD[nt.length-1]}-level spells. Pick new spells to prepare.`);else steps.push('You can prepare more spells. Check the Prepared Spells column of your class table.')}
  steps.push(`Read your class table for anything else new at level ${to}.`);
  return{from,to,gain,steps,slots:nt}}

const SHOP_ORDER=['Everyday','Common','Costly','c','u','r','v','l'];
const SHOP_CATS=['Gear','Weapons','Armor','Tools','Mounts','Services','Magic'];
const SHOP=(()=>{const out=[];let cat='Gear';
  const cp=t=>{const m=/^(\d+)(gp|sp|cp)$/.exec(t);return m?(+m[1])*({gp:100,sp:10,cp:1}[m[2]]):0};
  for(const line of SHOP_RAW.trim().split('\n')){
    if(!line.includes('|')){cat=line.trim();continue}

    if(cat==='Magic'){const [r,x]=p.split(':');out.push({name,cat,tier:r,cp:x?cp(x):0,known:!!x})}
    else{const c=cp(p);out.push({name,cat,tier:c<100?'Everyday':c<=5000?'Common':'Costly',cp:c,known:true})}}

const fmtCp=c=>c>=100&&c%100===0?(c/100).toLocaleString('en-US')+' gp':c>=100?(c/100).toLocaleString('en-US',{maximumFractionDigits:2})+' gp':c%10===0?(c/10)+' sp':c+' cp';

  if(!items.length)return '<p class="hint">Nothing matches that. Try a shorter word.</p>';
  let h='';
  for(const t of SHOP_ORDER){
    const rows=items.filter(i=>i.tier===t).sort((a,b)=>a.cp-b.cp||a.name.localeCompare(b.name));if(!rows.length)continue;
    const magic=!!SHOP_MAGIC[t],head=magic?SHOP_MAGIC[t][0]:t,band=magic?SHOP_MAGIC[t][1]:(SHOP_BANDS.find(b=>b[0]===t)||[])[1];
    h+=`<section class="card shoptier"><div class="bar"><h3 style="margin:0 auto 0 0">${esc(head)}</h3><span class="hint">${esc(band)}</span></div>`

// ---------------- weather
const WX=[['none','Clear'],['rain','Rain'],['storm','Storm'],['snow','Snow'],['fog','Fog'],['embers','Embers'],['leaves','Leaves']];
let wxP=[],wxKind=null,wxRaf=null,wxFlash=0;
const RM=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
function wxNew(k,init){const r=Math.random;const y0=init?r():-.05;
  if(k==='rain'||k==='storm')return{x:r()*1.2-.1,y:y0,vx:.0035,vy:.022+r()*.012,s:.5+r()*.5};
  if(k==='snow')return{x:r(),y:y0,vx:0,vy:.0018+r()*.0022,s:1.5+r()*2.5,ph:r()*99};
  if(k==='embers')return{x:r(),y:init?r():1.05,vx:(r()-.5)*.0015,vy:-(.0015+r()*.003),s:1.2+r()*2.2,ph:r()*99};
  if(k==='leaves')return{x:init?r():-.05,y:init?r():r()*.6,vx:.0016+r()*.002,vy:.0012+r()*.0015,s:4+r()*4,ph:r()*99,c:['#c8641e','#d9a21b','#9c3d1b','#7a8b2a'][r()*4|0]};
  if(k==='fog')return{x:init?r()*1.2-.1:-.25,y:r(),vx:.0004+r()*.0005,vy:0,s:.18+r()*.2};
  return{x:0,y:2,vx:0,vy:0,s:0}}
function wxStep(){const k=(S.map.weather||'none'),cvs=['dmwx','tblwx'].map(i=>document.getElementById(i)).filter(Boolean);
  if(k==='none'||!cvs.length){for(const c of cvs)c.getContext('2d').clearRect(0,0,c.width,c.height);wxRaf=null;wxKind=null;return}
  if(k!==wxKind){wxKind=k;wxP=[]}
  const N={rain:240,storm:360,snow:150,embers:70,leaves:36,fog:12}[k]||0;while(wxP.length<N)wxP.push(wxNew(k,true));
  for(let i=0;i<wxP.length;i++){const p=wxP[i];p.x+=p.vx;p.y+=p.vy;if(p.ph!=null){p.ph+=.03;p.x+=Math.sin(p.ph)*.0007}if(p.y>1.05||p.y<-.12||p.x>1.25||p.x<-.3)wxP[i]=wxNew(k,false)}
  if(k==='storm'&&Math.random()<.004)wxFlash=1;
  for(const c of cvs){const W=c.clientWidth,H=c.clientHeight;if(c.width!==W||c.height!==H){c.width=W;c.height=H}const x=c.getContext('2d');x.clearRect(0,0,W,H);
    if(k==='rain'||k==='storm'){x.strokeStyle='rgba(200,220,255,.75)';x.lineWidth=Math.max(1.6,W/900);x.beginPath();for(const p of wxP){const X=p.x*W,Y=p.y*H;x.moveTo(X,Y);x.lineTo(X-p.vx*W*1.6,Y-p.vy*H*1.6*p.s)}x.stroke()}
    else if(k==='snow'){x.fillStyle='rgba(255,255,255,.88)';for(const p of wxP){x.beginPath();x.arc(p.x*W,p.y*H,p.s,0,7);x.fill()}}
    else if(k==='embers'){for(const p of wxP){x.beginPath();x.arc(p.x*W,p.y*H,p.s,0,7);x.fillStyle=`rgba(255,${120+((p.ph*40)%80|0)},40,${.55+.4*Math.sin(p.ph*3)})`;x.fill()}}
    else if(k==='leaves'){for(const p of wxP){x.save();x.translate(p.x*W,p.y*H);x.rotate(p.ph*2);x.fillStyle=p.c;x.beginPath();x.ellipse(0,0,p.s,p.s*.5,0,0,7);x.fill();x.restore()}}
    else if(k==='fog'){for(const p of wxP){const R=p.s*Math.max(W,H),g=x.createRadialGradient(p.x*W,p.y*H,0,p.x*W,p.y*H,R);g.addColorStop(0,'rgba(220,225,230,.22)');g.addColorStop(1,'rgba(220,225,230,0)');x.fillStyle=g;x.fillRect(p.x*W-R,p.y*H-R,R*2,R*2)}}
    if(wxFlash>0){x.fillStyle=`rgba(255,255,255,${wxFlash*.55})`;x.fillRect(0,0,W,H)}}
  wxFlash=Math.max(0,wxFlash-.07);wxRaf=requestAnimationFrame(wxStep)}
function wxStart(){if(RM)return;if(!wxRaf&&(S.map.weather||'none')!=='none')wxRaf=requestAnimationFrame(wxStep);else if((S.map.weather||'none')==='none'&&!wxRaf)wxStep()}

// ---------------- walls + doors
const blocked=(w,k)=>w[k]===1||w[k]===2;
function edgeAt(f){if(!f)return null;const [fx,fy]=f,dx=Math.abs(fx-Math.round(fx)),dy=Math.abs(fy-Math.round(fy));
  if(Math.min(dx,dy)>.3)return null;
  if(dx<=dy){const X=Math.round(fx),Y=Math.floor(fy);if(X<0||X>S.map.cols||Y<0||Y>=S.map.rows)return null;return 'v:'+X+':'+Y}
  const X=Math.floor(fx),Y=Math.round(fy);if(X<0||X>=S.map.cols||Y<0||Y>S.map.rows)return null;return 'h:'+X+':'+Y}
function floodReveal(c0,r0){const m=S.map,w=m.walls||{},a=fogArr(),seen=new Uint8Array(m.cols*m.rows),q=[[c0,r0]];seen[r0*m.cols+c0]=1;let n=0;
  while(q.length){const [c,r]=q.pop();a[r*m.cols+c]=1;n++;
    const nb=[[c+1,r,'v:'+(c+1)+':'+r],[c-1,r,'v:'+c+':'+r],[c,r+1,'h:'+c+':'+(r+1)],[c,r-1,'h:'+c+':'+r]];
    for(const [nc,nr,k] of nb){if(nc<0||nr<0||nc>=m.cols||nr>=m.rows||seen[nr*m.cols+nc]||blocked(w,k))continue;seen[nr*m.cols+nc]=1;q.push([nc,nr])}}
  m.fog=fogStr(a);return n}
function doorSides(k){const [o,X,Y]=k.split(':').map((v,i)=>i?+v:v);return o==='v'?[[X-1,Y],[X,Y]]:[[X,Y-1],[X,Y]]}
function openDoorReveal(k){const m=S.map;if(m.autoDoor===false)return;const a=fogArr(),sides=doorSides(k).filter(([c,r])=>c>=0&&r>=0&&c<m.cols&&r<m.rows);
  if(sides.length<2)return;const lit=sides.map(([c,r])=>a[r*m.cols+c]);if(lit[0]&&!lit[1])floodReveal(...sides[1]);else if(lit[1]&&!lit[0])floodReveal(...sides[0])}

let AC=null,master=null,noiseB=null;const amb={};const snd={vol:.7,list:[],idx:-1,el:null,loop:true};
try{snd.vol=+(localStorage.getItem('dm-vol')||.7)}catch{}
function ac(){if(!AC){const A=window.AudioContext||window.webkitAudioContext;if(!A)return null;AC=new A();master=AC.createGain();master.gain.value=snd.vol;master.connect(AC.destination)}if(AC.state==='suspended')AC.resume();return AC}
function noise(){if(!noiseB){const n=AC.sampleRate*2;noiseB=AC.createBuffer(1,n,AC.sampleRate);const d=noiseB.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1}const s=AC.createBufferSource();s.buffer=noiseB;s.loop=true;return s}
function filt(type,f,Q){const b=AC.createBiquadFilter();b.type=type;b.frequency.value=f;if(Q)b.Q.value=Q;return b}
function gainN(v){const g=AC.createGain();g.gain.value=v;return g}
function chain(...n){for(let i=0;i<n.length-1;i++)n[i].connect(n[i+1]);return n[n.length-1]}
function env(g,t,a,peak,d){g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+a);g.gain.exponentialRampToValueAtTime(0.0001,t+a+d)}
function tone(type,f,t,a,peak,d,to){const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+a+d);env(g,t,a,peak,d);chain(o,g,master);o.start(t);o.stop(t+a+d+.05)}
function burst(t,f,type,peak,d){const s=noise(),b=filt(type,f),g=AC.createGain();env(g,t,.005,peak,d);chain(s,b,g,master);s.start(t,Math.random());s.stop(t+d+.05)}
const AMB={
  rain:{label:'Rain',make(){const s=noise(),out=gainN(.28);chain(s,filt('highpass',700),filt('lowpass',7000),out,master);s.start();const s2=noise(),o2=gainN(.12);chain(s2,filt('lowpass',400),o2,master);s2.start();return{stop(){s.stop();s2.stop()}}}},
  wind:{label:'Wind',make(){const s=noise(),bp=filt('bandpass',420,.9),g=gainN(.45),l=AC.createOscillator(),lg=gainN(260),l2=AC.createOscillator(),lg2=gainN(.2);l.frequency.value=.09;l2.frequency.value=.13;chain(l,lg,bp.frequency);chain(l2,lg2,g.gain);chain(s,bp,g,master);s.start();l.start();l2.start();return{stop(){s.stop();l.stop();l2.stop()}}}},
  fire:{label:'Campfire',make(){const s=noise(),g=gainN(.22);chain(s,filt('lowpass',380),g,master);s.start();const iv=setInterval(()=>{const t=AC.currentTime;for(let i=0;i<1+Math.random()*3;i++)burst(t+Math.random()*.2,2000+Math.random()*3000,'highpass',.15+Math.random()*.25,.02+Math.random()*.05)},180);return{stop(){s.stop();clearInterval(iv)}}}},
  cave:{label:'Cave drips',make(){const dl=AC.createDelay(1),fb=gainN(.35),wet=gainN(.5);dl.delayTime.value=.33;chain(dl,fb,dl);chain(dl,wet,master);const s=noise(),g=gainN(.05);chain(s,filt('lowpass',200),g,master);s.start();
    const iv=setInterval(()=>{if(Math.random()<.55){const t=AC.currentTime,o=AC.createOscillator(),e=AC.createGain(),f=1300+Math.random()*1200;o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*.45,t+.12);env(e,t,.003,.22,.16);o.connect(e);e.connect(master);e.connect(dl);o.start(t);o.stop(t+.25)}},700);return{stop(){clearInterval(iv);s.stop()}}}},
  crickets:{label:'Night crickets',make(){const iv=setInterval(()=>{const t=AC.currentTime;for(let c=0;c<2;c++){const base=t+Math.random()*.6,f=4300+Math.random()*700;for(let i=0;i<3;i++)tone('sine',f,base+i*.06,.005,.05,.035)}},650);return{stop(){clearInterval(iv)}}}},
  drums:{label:'Battle drums',make(){let n=0;const iv=setInterval(()=>{const t=AC.currentTime,hit=[1,0,1,0,1,1,1,0][n++%8];if(hit){tone('sine',110,t,.005,.9,.35,45);burst(t,900,'lowpass',.25,.08)}},300);return{stop(){clearInterval(iv)}}}},
};
const SFX={
  thunder:['Thunder',()=>{const t=AC.currentTime;burst(t,3000,'highpass',.5,.15);const s=noise(),b=filt('lowpass',260),g=AC.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(1.1,t+.15);g.gain.exponentialRampToValueAtTime(.0001,t+3.2);chain(s,b,g,master);s.start(t);s.stop(t+3.3)}],
  door:['Door creak',()=>{const t=AC.currentTime,o=AC.createOscillator(),b=filt('bandpass',900,6),g=AC.createGain(),l=AC.createOscillator(),lg=gainN(25);o.type='sawtooth';o.frequency.setValueAtTime(95,t);o.frequency.linearRampToValueAtTime(140,t+1.1);l.frequency.value=17;chain(l,lg,o.frequency);env(g,t,.08,.35,1.1);chain(o,b,g,master);o.start(t);l.start(t);o.stop(t+1.3);l.stop(t+1.3)}],
  sword:['Sword clash',()=>{const t=AC.currentTime;burst(t,4000,'highpass',.5,.05);for(const f of[2480,3710,5230,6900])tone('sine',f,t,.002,.18,.9)}],
  magic:['Magic',()=>{const t=AC.currentTime;[523,659,784,1047,1319,1568].forEach((f,i)=>tone('triangle',f,t+i*.07,.01,.22,.5));burst(t+.1,6000,'highpass',.08,.6)}],
  roar:['Monster roar',()=>{const t=AC.currentTime,o=AC.createOscillator(),l=AC.createOscillator(),lg=gainN(18),b=filt('lowpass',700),g=AC.createGain();o.type='sawtooth';o.frequency.setValueAtTime(95,t);o.frequency.linearRampToValueAtTime(70,t+1.4);l.frequency.value=9;chain(l,lg,o.frequency);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.7,t+.2);g.gain.exponentialRampToValueAtTime(.0001,t+1.6);chain(o,b,g,master);o.start(t);l.start(t);o.stop(t+1.7);l.stop(t+1.7);const s=noise(),sb=filt('bandpass',500,1.5),sg2=AC.createGain();env(sg2,t,.2,.35,1.3);chain(s,sb,sg2,master);s.start(t);s.stop(t+1.7)}],
  coins:['Coins',()=>{const t=AC.currentTime;for(let i=0;i<7;i++){const tt=t+Math.random()*.5;tone('sine',3000+Math.random()*1800,tt,.002,.12,.25);tone('sine',5200+Math.random()*1500,tt,.002,.06,.2)}}],
  win:['Victory',()=>{const t=AC.currentTime;[[523,0],[659,.16],[784,.32],[1047,.5]].forEach(([f,d],i)=>tone('triangle',f,t+d,.01,.3,i===3?1:.25))}],
  heal:['Healing',()=>{const t=AC.currentTime;[392,523,659,784].forEach((f,i)=>tone('sine',f,t+i*.12,.05,.2,.7))}],
};

   ${ui.tool==='draw'?`<div class="swatches">${['#ffd23f','#ff5a4e','#41c4cf','#ffffff','#111111'].map(c=>`<button class="sw ${ui.color===c?'on':''}" data-a="color" data-c="${c}" style="background:${c}" aria-label="Colour ${c}"></button>`).join('')}</div><button class="sm" data-a="drawundo" ${(m.draw||[]).length?'':'disabled'}>Undo line</button><button class="sm danger" data-a="drawclear" ${(m.draw||[]).length?'':'disabled'}>Clear drawings</button>`:''}</div>
   <div class="mapwrap"><canvas id="dmcv" tabindex="0" aria-label="Map preview. Click or drag to use the selected tool."></canvas><canvas id="dmwx" aria-hidden="true"></canvas></div>
   <p class="hint">${ui.tool==='move'?(ui.sel?'Click a square to place the selected token.':'Drag a token to move it. Drag it off the map to take it off. Pick a token below to place it.'):ui.tool==='ping'?'Click to flash a ring on the table screen.':ui.tool==='measure'?'Drag from one square to another. The distance shows on both screens (5 ft per square).':ui.tool==='draw'?'Drag to draw. Drawings show on the table, under the fog.':ui.tool==='wall'?'Drag along the grid lines where the map has walls. Drag over a wall to erase it. Walls only show on your screen.':ui.tool==='door'?'Click a grid line to add a door. Click a door to open or close it.':ui.tool==='room'?'Click inside a room to reveal everything up to its walls and closed doors.':'Click or drag across squares. The table screen updates as you go.'}</p>
   <h3 style="font-size:17px;margin:14px 0 8px">Tokens from the current fight</h3>
   ${L.length?`<div class="tray">${L.map(r=>`<button class="sm tok ${r.kind==='hero'?'':'foe'} ${m.tokens[r.id]?'placed':''} ${ui.sel===r.id?'on':''}" data-a="seltok" data-id="${r.id}">${esc(nameOf(r))}${m.tokens[r.id]?' ✓':''}</button>`).join('')}</div>`:'<p class="hint">Start a fight on the Combat tab and its heroes and monsters show up here as tokens.</p>'}
   ${L.some(r=>m.tokens[r.id])?`<div class="bar" style="margin-top:10px"><label for="auratok" style="color:var(--ink)">Circle around</label><select id="auratok" data-tmp="1" style="width:auto">${L.filter(r=>m.tokens[r.id]).map(r=>`<option value="${r.id}" ${ui.tmp.auratok===r.id?'selected':''}>${esc(nameOf(r))}</option>`).join('')}</select>
    <select id="aurarad" style="width:auto" aria-label="Circle size">${[0,5,10,15,20,30,60].map(v=>`<option value="${v}" ${num((m.auras||{})[ui.tmp.auratok||L.find(r=>m.tokens[r.id]).id])===v?'selected':''}>${v?v+' ft':'None'}</option>`).join('')}</select><span class="hint">for spells and auras</span></div>`:''}
  </div>
  <aside class="card add"><section><h3>Maps</h3><div class="list">${sc.map(([id,v])=>`<div class="trow"><button class="tname ${id===(S.map.sceneId||'')?'sel':''}" data-a="sgo" data-id="${id}">${esc(id===(S.map.sceneId||'')?S.map.name:v.name||'Untitled')}${id===(S.map.sceneId||'')?' <span class="hint">showing</span>':''}</button>${id&&id!==S.map.sceneId?`<button class="sm danger" data-a="sdel" data-id="${id}" aria-label="Delete map">${ui.arm==='sdel'+id?'Sure?':'×'}</button>`:''}</div>`).join('')}</div>
   <button class="sm" data-a="snew" style="margin-top:8px">New map</button>
   <label for="mname" style="margin-top:10px">This map's name</label><input id="mname" data-mn="1" value="${esc(S.map.name||'')}"></section>
  <section><h3>Weather</h3><div class="tray">${WX.map(([k,l])=>`<button class="sm ${(m.weather||'none')===k?'on':''}" data-a="wx" data-w="${k}">${l}</button>`).join('')}</div><p class="hint">Shows on the table screen. Saved with this map.</p></section>
  <section><h3>Map image</h3>${assets||mode==='local'?`<input type="file" id="mapfile" accept="image/*">`:'<p class="hint">Uploading needs editor access to this page.</p>'}
   <div class="grid2" style="margin-top:10px"><div><label for="mcols">Squares across</label><input id="mcols" data-m="cols" type="number" min="2" max="80" value="${m.cols}"></div><div><label for="mrows">Squares down</label><input id="mrows" data-m="rows" type="number" min="2" max="80" value="${m.rows}"></div></div>

   <label style="display:flex;gap:8px;align-items:center;color:var(--ink)"><input type="checkbox" data-mc="fogOn" style="width:auto" ${m.fogOn?'checked':''}> Fog of war</label></section>
  <section><details id="dt-table"><summary><b>Table screen setup</b></summary>
   ${OL&&LAN.tableLink?`<p class="hint">Open this link in a browser on the projector or TV computer, then press its Full screen button. It only shows the table, so it is safe to share with that screen.</p><p class="hint"><span class="code" style="word-break:break-all">${esc(LAN.tableLink)}</span></p><p><button class="sm" data-a="copytable">Copy table link</button> <button class="sm" data-a="newtable">${ui.arm==='newtable'?'Sure? The old link stops working':'Make a new link'}</button></p><p class="hint">Same computer as this one? Open <span class="code">${esc(location.origin+BASE+'/dm#table')}</span> in a new window instead.</p>`:`<p class="hint">${LAN.on?`Open <span class="code">${esc(location.origin+'/#table')}</span> in a <b>new browser window</b>`:`Open this page's link in a <b>new browser window</b>, add <span class="code">#table</span> to the end of the address`}, drag that window onto the projector or TV, and press its Full screen button.</p>`}
   <label style="display:flex;gap:8px;align-items:center;color:var(--ink)"><input type="checkbox" data-mc="showTokens" style="width:auto" ${m.showTokens?'checked':''}> Show tokens (turn off for real minis)</label>
   <label style="display:flex;gap:8px;align-items:center;color:var(--ink);margin-top:4px"><input type="checkbox" data-mc="monBars" style="width:auto" ${m.monBars?'checked':''}> Show monster health bars</label>
   <label style="display:flex;gap:8px;align-items:center;color:var(--ink);margin-top:4px"><input type="checkbox" data-mc="grid" style="width:auto" ${m.grid?'checked':''}> Show grid lines</label>
   <div class="grid2" style="margin-top:10px"><div><label for="tz">Zoom %</label><input id="tz" data-t="zoom" type="number" step="1" value="${t.zoom}"></div><div><label for="tr">Rotate</label><select id="tr" data-t="rot">${[0,90,180,270].map(v=>`<option value="${v}" ${num(t.rot)===v?'selected':''}>${v}°</option>`).join('')}</select></div>
   <div><label for="tx">Shift left/right %</label><input id="tx" data-t="dx" type="number" step=".5" value="${t.dx}"></div><div><label for="ty">Shift up/down %</label><input id="ty" data-t="dy" type="number" step=".5" value="${t.dy}"></div></div>
   <p class="hint">Use zoom and shift to make one square match one inch on the table.</p></details></section></aside></div>`}

// ---------------- events
function act(a,ds,el){
  const C=S.combat,r=ds.id&&C.list.find(x=>x.id===ds.id);
  if(!['clear','del','dclear','tdel','hdel','sdel','wallclear','pkick'].includes(a)&&ui.arm){ui.arm=null}
  switch(a){
  case 'next':return step(1);
  case 'prev':return step(-1);
  case 'sort':return cMut(C=>fullSort(C.list));
  case 'roll':return cMut(C=>{const rs=C.list.filter(x=>x.kind!=='hero'&&x.init==null);for(const x of rs){const n=d20();x.init=n+dexOf(x);log(`${x.name} rolled ${n}${sg(dexOf(x))} = ${x.init}`)}fullSort(C.list)});
  case 'undo':{const u=undo.pop();if(!u)return;const p=JSON.parse(u);S.combat=p.c;for(const[id,h] of Object.entries(p.h)){if(S.heroes[id]&&JSON.stringify(S.heroes[id])!==JSON.stringify(h)){S.heroes[id]=h;saveHero(id)}}saveCombat();return render()}
  case 'clear':if(ui.arm!=='clear'){ui.arm='clear';return render()}ui.arm=null;return cMut(C=>{C.list=[];C.round=1;C.turnId=null;C.log=[];S.map.tokens={};saveMap()});
  case 'rm':return cMut(C=>{if(C.turnId===ds.id){const i=C.list.findIndex(x=>x.id===ds.id);const nx=C.list[i+1]||C.list[0];C.turnId=nx&&nx.id!==ds.id?nx.id:null}C.list=C.list.filter(x=>x.id!==ds.id);if(S.map.tokens[ds.id]){delete S.map.tokens[ds.id];saveMap()}});
  case 'up':case 'down':return cMut(C=>{const L=C.list,i=L.indexOf(r),j=i+(a==='up'?-1:1);if(i<0||j<0||j>=L.length)return;[L[i],L[j]]=[L[j],L[i]]});
  case 'hit':case 'heal':{const v=Math.abs(Math.round(num(ui.tmp['amt-'+ds.id])));if(!r||!v)return;delete ui.tmp['amt-'+ds.id];
    return cMut(()=>{const h=heroOf(r),hp=hpOf(r),max=maxOf(r);
      if(a==='hit'){if(h&&hp<=0&&max>0){h.ds=h.ds||{s:0,f:0};h.ds.f=Math.min(3,h.ds.f+1);dirtyH.add(r.ref);log(`${nameOf(r)} took damage while down: 1 failure`)}else{const nv=Math.max(0,hp-v);setHp(r,nv);if(h&&nv<=0){h.ds={s:0,f:0};h.lastDS=''}log(`${nameOf(r)} took ${v}${nv<=0?' and dropped':''}`)}}
      else{const nv=max?Math.min(max,hp+v):hp+v;setHp(r,nv);if(h&&hp<=0&&nv>0){h.ds={s:0,f:0};h.lastDS=''}log(`${nameOf(r)} healed ${v}`)}})}
  case 'uncond':return cMut(()=>{r.conds=(r.conds||[]).filter(c=>c!==ds.c)});
  case 'more':ui.more[ds.id]=!ui.more[ds.id];return render();
  case 'slot':{const h=S.heroes[ds.h];if(!h)return;h.slots=normSlots(h.slots);const s=h.slots[+ds.l],k=+ds.k;s.used=k<s.used?k:k+1;saveHero(ds.h);return render()}
  case 'dsroll':return cMut(()=>deathSave(r,false));
  case 'dss':case 'dsf':{const h=heroOf(r);if(!h)return;return cMut(()=>{const d=h.ds=h.ds||{s:0,f:0},key=a==='dss'?'s':'f',k=+ds.k;d[key]=k<d[key]?k:k+1;dirtyH.add(r.ref)})}
  case 'addparty':return addRows(Object.keys(S.heroes).filter(id=>!C.list.some(x=>x.ref===id)).map(id=>({id:uid(),kind:'hero',ref:id,init:null,conds:[]})));
  case 'addhero':return addRows([{id:uid(),kind:'hero',ref:ds.id,init:null,conds:[]}]);
  case 'addmon':{const sel=document.getElementById('addm');const id=(sel&&sel.value)||ui.tmp.addm;if(!id)return;return addMonster(id,ui.tmp.addq||1,ui.tmp.addr==='roll')}
  case 'addother':{const n=String(ui.tmp.on||'').trim();if(!n)return document.getElementById('on')?.focus();const hp=Math.round(num(ui.tmp.ohp));delete ui.tmp.on;delete ui.tmp.ohp;return addRows([{id:uid(),kind:'other',name:n,init:null,dexMod:0,ac:'',hp,hpMax:hp,conds:[]}])}
  case 'new':{const id=uid(),hero=ds.k==='hero';const o=hero?{name:'New character',level:1,ac:10,hpMax:10,hp:10,speed:30,str:10,dex:10,con:10,int:10,wis:10,cha:10,slots:normSlots(),ds:{s:0,f:0},autoDS:false}:{name:'New monster',cr:'',ac:12,hp:10,hpDice:'',speed:'30 ft.',str:10,dex:10,con:10,int:10,wis:10,cha:10,attacks:'',traits:''};
    (hero?S.heroes:S.monsters)[id]=o;hero?saveHero(id):saveMon(id);ui.edit={kind:ds.k,id};render();const f=document.getElementById('f-name');if(f){f.focus();f.select()}return}
  case 'edit':ui.edit={kind:ds.k,id:ds.id};return render();
  case 'del':{if(ui.arm!=='del'){ui.arm='del';return render()}ui.arm=null;const ed=ui.edit;if(!ed)return;const p=(ed.kind==='hero'?'heroes/':'monsters/')+ed.id;delete (ed.kind==='hero'?S.heroes:S.monsters)[ed.id];save(p,null);ui.edit=null;return render()}
  case 'dup':{const ed=ui.edit,o=S.monsters[ed.id];if(!o)return;const id=uid();S.monsters[id]={...clone(o),name:(o.name||'Monster')+' copy'};saveMon(id);ui.edit={kind:'mon',id};return render()}
  case 'mfight':addMonster(ds.id,ui.tmp.mq||1,false);ui.tab='combat';location.hash='#combat';return render();
  case 'rest':{const o=S.heroes[ui.edit.id];if(!o)return;o.hp=num(o.hpMax);o.slots=normSlots(o.slots).map(s=>({max:s.max,used:0}));o.ds={s:0,f:0};o.lastDS='';saveHero(ui.edit.id);setStatus('Long rest: HP and spell slots restored');return render()}
  case 'fill':{const o=S.heroes[ui.edit.id];const t=classSlots(o.cls,o.level);const msg=document.getElementById('fillmsg');if(!t){if(msg)msg.textContent='Type a spellcasting class first (Wizard, Cleric, Paladin, Warlock…).';return}
    o.slots=normSlots(o.slots).map((s,l)=>({max:t[l]||0,used:Math.min(s.used,t[l]||0)}));saveHero(ui.edit.id);render();const m2=document.getElementById('fillmsg');if(m2)m2.textContent='Filled from the class table. Check it against the sheet.';return}
  case 'lvl':ui.lvl={id:ui.edit.id};return render();
  case 'lvlx':ui.lvl=null;return render();
  case 'lvlgo':{const id=ui.edit.id,o=S.heroes[id];if(!o)return;const how=ui.tmp.lvhow||'avg';if(how==='manual'&&!num(ui.tmp.lvroll)){document.getElementById('lvroll')?.focus();return}
    const p=levelUp(o,how,ui.tmp.lvroll);o.level=p.to;if(p.gain){o.hpMax=num(o.hpMax)+p.gain;o.hp=num(o.hp)+p.gain}
    if(p.slots)o.slots=normSlots(o.slots).map((s,l)=>({max:p.slots[l]||0,used:Math.min(s.used,p.slots[l]||0)}));
    saveHero(id);ui.lvl=null;delete ui.tmp.lvroll;setStatus(`${o.name||'Character'} is now level ${p.to}${p.gain?` (+${p.gain} max HP)`:''}`);return render()}
  case 'lvlshow':{const o=S.heroes[ui.edit.id];if(!o)return;const p=levelUp(o,'avg');S.map.card={title:`${o.name||'Hero'}: level ${p.to}!`,lines:p.steps.filter(s=>!/Filled in for you/.test(s)).map(s=>s.replace(/ Average: .*$/,''))};saveMap();setStatus('Level-up card is on the table screen. Hide it from the Combat tab.');return}
  case 'hidecard':S.map.card=null;saveMap();return render();
  case 'tool':ui.tool=ds.t;ui.sel=null;return render();
  case 'qd':{const n=+ds.n,md=Math.round(num(ui.tmp.dmod));return doRoll(`1d${n}${md?sg(md):''}`,{who:ui.tmp.dwho,label:'',secret:ui.tmp.dsecret})}
  case 'adv':case 'dis':{const md=Math.round(num(ui.tmp.dmod));return doRoll(`2d20${a==='adv'?'kh1':'kl1'}${md?sg(md):''}`,{who:ui.tmp.dwho,label:a==='adv'?'Advantage':'Disadvantage',secret:ui.tmp.dsecret})}
  case 'droll':{const e=String(ui.tmp.dexpr||'').trim();if(!e)return document.getElementById('dexpr')?.focus();return doRoll(e,{who:ui.tmp.dwho,label:ui.tmp.dlabel,secret:ui.tmp.dsecret})}
  case 'rollatk':return doRoll(ds.e,{who:ds.w,label:ds.l});
  case 'dclear':if(ui.arm!=='dclear'){ui.arm='dclear';return render()}ui.arm=null;S.dice.rolls=[];save('dice/log',S.dice);return render();
  case 'tnew':{const id=uid();S.tables[id]={name:'New table',items:''};save('tables/'+id,S.tables[id]);ui.tedit=id;render();const f=document.getElementById('tf-name');if(f){f.focus();f.select()}return}
  case 'tedit':ui.tedit=ds.id||null;return render();
  case 'troll':return rollTable(ds.id);
  case 'tdel':if(ui.arm!=='tdel'){ui.arm='tdel';return render()}ui.arm=null;delete S.tables[ui.tedit];save('tables/'+ui.tedit,null);ui.tedit=null;return render();
  case 'hnew':{const id=uid();S.handouts[id]={title:'New handout',text:'',img:null};save('handouts/'+id,S.handouts[id]);ui.hedit=id;render();const f=document.getElementById('hf-title');if(f){f.focus();f.select()}return}
  case 'hedit':ui.hedit=ds.id;return render();
  case 'hshow':S.map.handout=ui.hedit;saveMap();toast('Showing on the table screen');return render();
  case 'hhide':S.map.handout=null;saveMap();return render();
  case 'himgx':{const h=S.handouts[ui.hedit];if(h){h.img=null;save('handouts/'+ui.hedit,h)}return render()}
  case 'hdel':if(ui.arm!=='hdel'){ui.arm='hdel';return render()}ui.arm=null;if(S.map.handout===ui.hedit){S.map.handout=null;saveMap()}delete S.handouts[ui.hedit];save('handouts/'+ui.hedit,null);ui.hedit=null;return render();
  case 'color':ui.color=ds.c;return render();
  case 'drawundo':S.map.draw=(S.map.draw||[]).slice(0,-1);saveMap();return render();
  case 'drawclear':S.map.draw=[];saveMap();return render();
  case 'snew':return newScene();
  case 'sgo':if(ds.id)switchScene(ds.id);return;
  case 'sdel':if(ui.arm!=='sdel'+ds.id){ui.arm='sdel'+ds.id;return render()}ui.arm=null;delete S.scenes[ds.id];save('scenes/'+ds.id,null);return render();
  case 'savetitle':lanPost('/api/title',{title:ui.tmp.gtitle??LAN.title}).then(j=>{setTitle(j.title);delete ui.tmp.gtitle;render();toast('Game name saved')}).catch(e=>toast(e.message));return;
  case 'shopcat':ui.tmp.shopcat=ds.id||'';return render();
  case 'charexp':return exportHeroes(Object.keys(S.heroes));
  case 'charexp1':return exportHeroes(ui.edit&&ui.edit.kind==='hero'?[ui.edit.id]:[]);
  case 'copytable':(navigator.clipboard?navigator.clipboard.writeText(LAN.tableLink):Promise.reject()).then(()=>toast('Table link copied')).catch(()=>toast(LAN.tableLink));return;
  case 'newtable':if(ui.arm!=='newtable'){ui.arm='newtable';return render()}ui.arm=null;fetch(BASE+'/api/newtablekey',{method:'POST',headers:{'X-DM-Key':DMKEY}}).then(r=>r.json()).then(j=>{LAN.tableLink=location.origin+BASE+'/table?t='+encodeURIComponent(j.key);render();toast('New table link ready')}).catch(()=>toast('Could not make a new link'));return;
  case 'copyjoin':case 'copydm':{const u=a==='copydm'?location.origin+BASE+'/dm?k='+encodeURIComponent(DMKEY||''):LAN.url;(navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(()=>toast(a==='copydm'?'DM link copied. Keep it private.':'Join link copied')).catch(()=>toast(u));return}
  case 'newcode':lanPost('/api/newcode',{}).then(j=>{LAN.code=j.code;render();toast('New code: '+j.code)}).catch(e=>toast(e.message));return;
  case 'psel':LAN.sel=ds.id;return render();
  case 'psend':{const t=String(ui.tmp.pmsg||'').trim();if(!t)return document.getElementById('pmsg')?.focus();lanPost('/api/tell',{to:LAN.sel,text:t}).then(()=>{ui.tmp.pmsg='';render();document.getElementById('pmsg')?.focus()}).catch(e=>toast(e.message));return}
  case 'phsend':{const id=ui.tmp.phand||Object.entries(S.handouts).sort((a,b)=>String(a[1].title).localeCompare(b[1].title))[0]?.[0],h=S.handouts[id];if(!h)return;lanPost('/api/tell',{to:LAN.sel,handout:{title:h.title,text:h.text,img:h.img}}).then(()=>toast('Handout sent to '+pName(LAN.sel))).catch(e=>toast(e.message));return}
  case 'pkick':if(ui.arm!=='pkick'+ds.id){ui.arm='pkick'+ds.id;return render()}ui.arm=null;if(LAN.sel===ds.id)LAN.sel='all';lanPost('/api/kick',{pid:ds.id}).catch(()=>{});return;
  case 'gridtog':S.map.grid=!S.map.grid;saveMap();return render();
  case 'wx':S.map.weather=ds.w;saveMap();return render();
  case 'wallclear':if(ui.arm!=='wallclear'){ui.arm='wallclear';return render()}ui.arm=null;S.map.walls={};saveMap();return render();
  case 'amb':return toggleAmb(ds.k);
  case 'sfx':return playSfx(ds.k);
  case 'sndstop':return stopAll();
  case 'track':return playTrack(+ds.i);
  case 'mplay':if(snd.el&&snd.idx>=0){snd.el.paused?snd.el.play().catch(()=>{}):snd.el.pause();return}return playTrack(0);
  case 'mnext':return playTrack(snd.idx+1);
  case 'mprev':return playTrack(snd.idx-1);
  case 'fogall':{const a=new Uint8Array(S.map.cols*S.map.rows).fill(+ds.v);S.map.fog=fogStr(a);saveMap();return drawAll()}
  case 'seltok':ui.tool='move';ui.sel=ui.sel===ds.id?null:ds.id;return render();
  }}
document.addEventListener('click',e=>{if(TABLE)return;const b=e.target.closest('[data-a]');if(!b||b.disabled)return;e.preventDefault();act(b.dataset.a,b.dataset,b)});
document.addEventListener('input',e=>{const t=e.target;
  if(t.dataset.tf){const o=S.tables[ui.tedit];if(o){o[t.dataset.tf]=t.value;save('tables/'+ui.tedit,o)}return}
  if(t.dataset.hf){const o=S.handouts[ui.hedit];if(o){o[t.dataset.hf]=t.value;save('handouts/'+ui.hedit,o);if(S.map.handout===ui.hedit)emitMap()}return}
  if(t.dataset.mn){S.map.name=t.value;saveMap();return}
  if(t.id==='vol'){setVol(+t.value);return}
  if(t.dataset.tmp){ui.tmp[t.id]=t.type==='checkbox'?t.checked:t.value;if(t.id==='brush')ui.brush=+t.value;if(t.id==='shopq')return refreshShop();if(t.id==='esearch')refreshList();if(t.id==='addms'){const sel=document.getElementById('addm');if(sel)sel.innerHTML=monOpts()}return}
  if(t.dataset.f||t.dataset.slot){const ed=ui.edit;if(!ed)return;const o=(ed.kind==='hero'?S.heroes:S.monsters)[ed.id];if(!o)return;
    if(t.dataset.slot){o.slots=normSlots(o.slots);const s=o.slots[+t.dataset.slot];s.max=Math.max(0,Math.min(9,Math.round(num(t.value))));s.used=Math.min(s.used,s.max)}
    else o[t.dataset.f]=t.type==='number'?(t.value===''?'':num(t.value)):t.value;
    ed.kind==='hero'?saveHero(ed.id):saveMon(ed.id);updateDerived();return}

// Both editions (this computer / online) talk through the same three interfaces. Only the way
// messages travel differs: lanConnect() uses fetch + EventSource, onlineConnect() fetch + a WebSocket.
function makeAdapter(docs,upload){
  const subs=[],roomL={},tab=uid();
  const meta={fromCache:false,hasPendingWrites:false};
  const snapCol=n=>{const ds=Object.keys(docs).filter(p=>p.startsWith(n+'/')&&p.split('/').length===2).map(p=>({id:p.split('/')[1],exists:true,data:()=>docs[p],metadata:meta}));return{docs:ds,size:ds.length,empty:!ds.length,metadata:meta,docChanges:()=>[]}};
  const snapDoc=p=>({id:p.split('/').pop(),exists:p in docs,data:()=>docs[p],metadata:meta});
  const notify=path=>{for(const x of subs){if(x.kind==='col'&&path.startsWith(x.name+'/')&&path.split('/').length===2)x.cb(snapCol(x.name));if(x.kind==='doc'&&path===x.name)x.cb(snapDoc(x.name))}};
  const db={collection:name=>({onSnapshot(cb){const x={kind:'col',name,cb};subs.push(x);setTimeout(()=>cb(snapCol(name)));return()=>subs.splice(subs.indexOf(x),1)}}),
    doc:path=>({set:d=>lanPost('/api/set',{path,data:d}),delete:()=>lanPost('/api/set',{path,data:null}),onSnapshot(cb){const x={kind:'doc',name:path,cb};subs.push(x);setTimeout(()=>cb(snapDoc(path)));return()=>subs.splice(subs.indexOf(x),1)}})};
  const room={emit:(topic,data)=>lanPost('/api/emit',{topic,data,tab}),on:(topic,fn)=>{(roomL[topic]=roomL[topic]||[]).push(fn);return()=>{}}};
  const feed=m=>{
    if(m.type==='doc'){if(m.data==null)delete docs[m.path];else docs[m.path]=m.data;notify(m.path)}
    else if(m.type==='room'){for(const f of roomL[m.topic]||[])f({topic:m.topic,data:m.data,sameTab:m.tab===tab,isMe:true})}
    else if(m.type==='title'){setTitle(m.title);if(!TABLE&&ui.tab==='players')render()}
    else if(m.type==='sync'){setTitle(m.title);for(const k of Object.keys(docs))delete docs[k];Object.assign(docs,m.docs||{});LAN.code=m.code||LAN.code;LAN.players=m.players||[];LAN.chat=m.chat||[];
      for(const x of subs)x.kind==='col'?x.cb(snapCol(x.name)):x.cb(snapDoc(x.name));if(!TABLE)render()}
    else lanEvent(m)};
  return{db,room,assets:{upload},feed}}
async function lanConnect(){
  if(!/^https?:$/.test(location.protocol))return null;
  try{const r=await fetch('/api/ping',{cache:'no-store'});if(!r.ok)return null;const j=await r.json();if(!j.ok||!j.local)return null}catch{return null}
  const docs={};
  const st=await (await fetch('/api/state',{cache:'no-store'})).json();Object.assign(docs,st.docs||{});
  LAN.code=st.code;LAN.url=st.url;LAN.players=st.players||[];LAN.chat=st.chat||[];
  const upload=async f=>{const r=await fetch('/api/upload',{method:'POST',headers:{'Content-Type':f.type||'application/octet-stream','X-Filename':encodeURIComponent(f.name||'file')},body:f});const j=await r.json().catch(()=>({}));if(!r.ok)throw{message:j.error||'Upload failed'};return j};
  const A=makeAdapter(docs,upload);
  const es=new EventSource('/api/events');let down=null;
  es.onopen=()=>{clearTimeout(down);if(statusEl.textContent.startsWith('Lost'))setStatus('Reconnected')};
  es.onerror=()=>{clearTimeout(down);down=setTimeout(()=>setStatus('Lost the connection to the DM Screen program. Is its window still open?'),3000)};
  es.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch{return}A.feed(m)};
  return{db:A.db,room:A.room,assets:A.assets}}
// Online edition: the DM key comes in the link (?k=...), is kept in this browser, then removed from the address bar.
async function onlineConnect(){
  if(!OL)return null;
  if(VIEWER)return tableConnect();
  const q=new URLSearchParams(location.search);let k=q.get('k');
  if(k){try{localStorage.setItem('dm-key-'+OL,k)}catch{}history.replaceState(null,'',location.pathname+location.hash)}
  else{try{k=localStorage.getItem('dm-key-'+OL)}catch{}}
  if(!k)throw new Error("This page needs your private DM link. Open the full link you got when you started the game.");
  DMKEY=k;
  let r;try{r=await fetch(BASE+'/api/state',{headers:{'X-DM-Key':DMKEY},cache:'no-store'})}catch{throw new Error("Can't reach the DM Screen server. Check your internet.")}
  if(!r.ok)throw new Error(r.status===404?'That game no longer exists.':"That DM link doesn't work. Open the full link you got when you started the game.");
  const st=await r.json(),docs={};Object.assign(docs,st.docs||{});
  setTitle(st.title);loadTableLink();LAN.code=st.code;LAN.url=location.origin+BASE+'/';LAN.players=st.players||[];LAN.chat=st.chat||[];
  const upload=async f=>{const r=await fetch(BASE+'/api/upload',{method:'POST',headers:{'Content-Type':f.type||'application/octet-stream','X-DM-Key':DMKEY},body:f});const j=await r.json().catch(()=>({}));if(!r.ok)throw{message:j.error||'Upload failed'};return j};
  const A=makeAdapter(docs,upload);
  let skipSync=true,retry=0,ping=null;
  const open=()=>{
    const ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+BASE+'/ws',['dm.'+DMKEY]);
    ws.onopen=()=>{retry=0;if(statusEl.textContent.startsWith('Lost'))setStatus('Reconnected');clearInterval(ping);ping=setInterval(()=>{try{ws.send('ping')}catch{}},25000)};
    ws.onmessage=e=>{if(e.data==='pong')return;let m;try{m=JSON.parse(e.data)}catch{return}if(m.type==='sync'&&skipSync){skipSync=false;return}A.feed(m)};
    ws.onclose=()=>{clearInterval(ping);skipSync=false;setStatus('Lost the connection. Trying again…');setTimeout(open,Math.min(10000,1000*2**retry++))}};
  open();
  return{db:A.db,room:A.room,assets:A.assets}}
// Projector / TV computer: view-only. Uses its own table key (?t=...) and receives only what the table screen draws.

  <div class="card" style="margin-top:16px"><div class="bar"><label for="psel" style="color:var(--ink);font-weight:700">Talking to</label><select id="psel" style="width:auto"><option value="all">Everyone</option>${ps.map(p=>`<option value="${p.pid}" ${sel===p.pid?'selected':''}>${esc(p.name)}${p.charName?' ('+esc(p.charName)+')':''}</option>`).join('')}</select></div>
   <div class="thread" id="pthread">${thread.length?thread.map(bubble).join(''):'<p class="hint">No messages yet. Messages you send only go to the player you pick.</p>'}</div>
   <div class="grid2" style="grid-template-columns:minmax(0,1fr) auto;margin-top:10px"><input id="pmsg" data-tmp="1" value="${tmpv('pmsg')}" placeholder="Message to ${esc(pName(sel))}…" autocomplete="off"><button class="pri" data-a="psend">Send</button></div>
   ${hs.length?`<div class="bar" style="margin-top:8px"><select id="phand" data-tmp="1" style="width:auto;max-width:60%" aria-label="Handout">${hs.map(([id,h])=>`<option value="${id}" ${ui.tmp.phand===id?'selected':''}>${esc(h.title||'Untitled')}</option>`).join('')}</select><button class="sm" data-a="phsend">Send handout to ${esc(pName(sel))}</button></div>`:''}</div></div>
  <aside class="card add"><section><h3>Players (${ps.length})</h3>${ps.length?`<div class="list">${ps.map(p=>`<div class="prow"><span class="dot ${p.online?'on':''}" title="${p.online?'Connected':'Not connected'}"></span><button class="tname ${sel===p.pid?'sel':''}" data-a="psel" data-id="${p.pid}">${esc(p.name)}<span class="hint"> ${p.charName?esc(p.charName):'choosing a character'}</span></button><button class="sm danger" data-a="pkick" data-id="${p.pid}" aria-label="Remove ${esc(p.name)}">${ui.arm==='pkick'+p.pid?'Sure?':'×'}</button></div>`).join('')}</div>`:'<p class="hint">Nobody has joined yet. Share the address and code.</p>'}</section>
  <section><p class="hint">Player dice rolls show up in your Dice log and on the table screen. Players see their own character sheet live as you change it.</p></section></aside></div>`}

// ---------------- boot
let loadTimer=null;
async function boot(){
  if(TABLE)startTable();else route();
  db=await use('db');let L=null;
  if(!db){if(OL){try{L=await onlineConnect()}catch(e){setStatus(e.message||String(e));return render()}}else L=await lanConnect();if(L)db=L.db}
  if(!db){mode='local';try{const d=JSON.parse(localStorage.getItem('dm-screen-v1')||'null');if(d){Object.assign(S,d);S.map={...defMap(),...d.map}}}catch{}setStatus(TABLE?'':'Not connected: saving in this browser only');return render()}
  mode='db';if(L){room=L.room;assets=L.assets;LAN.on=true;render()}else{const [u,rm,as]=await Promise.all([use('user'),use('room'),use('assets')]);room=rm;assets=as;
  try{if(u&&(await u.can('data.write'))===false){readOnly=true}}catch{}}
  loadTimer=setTimeout(()=>setStatus("Can't reach your saved game yet. Check your connection."),10000);
  const done=()=>{clearTimeout(loadTimer);if(!readOnly&&!Object.keys(pend).length)setStatus(TABLE?'':savedMsg());if(readOnly)setStatus('View only: you can look but not change things')};
  const onErr=e=>{clearTimeout(loadTimer);setStatus('Lost the connection to your saved game. Reload the page.')};
  const col=name=>db.collection(name).onSnapshot(snap=>{const m={};for(const d of snap.docs){const p=name+'/'+d.id;if(pending(p)){if(S[name][d.id])m[d.id]=S[name][d.id]}else m[d.id]=clone(d.data())}
      for(const id in S[name])if(!m[id]&&(((name+'/'+id) in pend&&pend[name+'/'+id]!==null)||busy[name+'/'+id]))m[id]=S[name][id];
      if(JSON.stringify(m)!==JSON.stringify(S[name])){S[name]=m;render()}if(!snap.metadata.fromCache)done()},onErr);
  col('heroes');col('monsters');col('tables');col('handouts');col('scenes');
  db.doc('dice/log').onSnapshot(s=>{if(!pending('dice/log')&&s.exists){const c=clone(s.data());if(JSON.stringify(c)!==JSON.stringify(S.dice)){S.dice={rolls:[],...c};const r=(S.dice.rolls||[])[0];if(TABLE&&r&&(!lastRoll||r.id!==lastRoll.id)){lastRoll=r;setTimeout(renderOverlay,9100)}if(ui.tab==='dice'||TABLE)render()}}},onErr);
  db.doc('combat/current').onSnapshot(s=>{if(!pending('combat/current')&&s.exists){const c=clone(s.data());if(JSON.stringify(c)!==JSON.stringify(S.combat)){S.combat={round:1,turnId:null,list:[],log:[],...c};render()}}if(!s.metadata.fromCache)done()},onErr);
  db.doc('map/current').onSnapshot(s=>{if(!pending('map/current')&&s.exists){const c=clone(s.data());if(JSON.stringify(c)!==JSON.stringify(S.map)){S.map={...defMap(),...c,table:{...defMap().table,...(c.table||{})},rem:{...defMap().rem,...(c.rem||{})}};render()}}if(!s.metadata.fromCache)done()},onErr);
  if(room&&TABLE){
    room.on('map',msg=>{if(msg.sameTab||!msg.data||typeof msg.data!=='object')return;const c=msg.data;if(num(c.cols)>0&&num(c.rows)>0){S.map={...defMap(),...c,table:{...defMap().table,...(c.table||{})}};drawAll()}});
    room.on('combat',msg=>{if(msg.sameTab||!msg.data||!Array.isArray(msg.data.list))return;S.combat=msg.data;drawAll()});
    room.on('roll',msg=>{const d=msg.data;if(!d||typeof d!=='object'||d.secret)return;lastRoll={...d,t:Date.now()};renderOverlay();setTimeout(renderOverlay,9100)});
    room.on('ruler',msg=>{const d=msg.data||{};if(!Array.isArray(d.a)||!Array.isArray(d.b))return;ruler={a:d.a.map(Number),b:d.b.map(Number),live:!d.end,t:Date.now()};drawAll()});
    room.on('ping',msg=>{const d=msg.data||{};if(Number.isFinite(d.x)&&Number.isFinite(d.y)){ping={x:d.x,y:d.y,t:Date.now()};drawAll()}})}}
boot();
}
</script>
